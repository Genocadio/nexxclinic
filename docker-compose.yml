version: "3.9"

services:
  frontend:
    # Uses pre-built image from CI — no build args needed
    image: genoyves/nexclinic-front:latest
    container_name: nexxclinic-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Runtime config — change these per environment, no rebuild required
      API_BASE_URL: http://backend:8080
      SUPABASE_URL: http://host.docker.internal:55321
      SUPABASE_ANON_KEY: your-supabase-anon-key-here
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
